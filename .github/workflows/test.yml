name: Test seminar companion

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-session1-1:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install standard ERGM packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ergm
            any::jsonlite
            any::Rglpk

      - name: Rebuild public-network data
        run: python scripts/build_session1_1_public_data.py

      - name: Lint and test
        env:
          PYTHONPATH: app
        run: |
          ruff check app scripts tests
          python -m py_compile app/*.py app/pages/*.py scripts/build_session1_1_public_data.py
          pytest -q
